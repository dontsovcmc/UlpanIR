schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Принцип простоты (решение владельца 26.11.2026): код и схемы — простые и надёжные для реальных условий
  пульта: дома, батарейка CR2032, один владелец. Защиты от маловероятных событий не делать — ни в требованиях,
  ни в design, ни в коде: атаки, пропадание питания во время записи, несколько клиентов сразу, сбой флеша,
  переполнение счётчиков и т. п. Если сбой маловероятен и исправляется простым действием (настроить заново,
  вынуть батарейку, перезапустить) — защиту не строить, а записать, как пульт себя поведёт. Защита нужна только
  от реального вреда: порча железа, быстрый разряд батарейки, излучение мусорных кодов. Сомневаешься — спроси
  владельца, а не усложняй.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
