; Стенд UlpanIR: ESP32-C6 Super Mini шьёт CH592F по RVSWD и проверяет плату пульта.
; Решения — openspec/changes/add-test-stand/design.md (§2 — платформа и флаги, как у waterius_flasher).

[platformio]
default_envs = esp32c6

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitm-1
build_flags =
    ; у C6 нет USB OTG: порт — встроенный USB Serial/JTAG, класс HWCDC ядра
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; логи ядра не должны попадать в порт: по нему идут команды и лог пульта
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.1.0\"
    -Wall
    -Isrc
    -Isrc/port
    -Ivendor/ch32fun/minichlink/funprog
build_src_filter = +<*>
test_ignore = *
monitor_speed = 115200

; Чистый код на Mac: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Isrc -I../firmware/src
build_src_filter = +<core/>
test_build_src = yes
